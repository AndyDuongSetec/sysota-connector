apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'au.com.setec.sysotaconnector'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField 'String', 'APPWRITE_STORAGE_BUCKET_ID', '"ota-updates"'
    }

    buildTypes {
        debug {
            buildConfigField 'long', 'AUTO_UPDATE_INTERVAL_IN_MINUTE', '5L'
        }
        release {
            buildConfigField 'long', 'AUTO_UPDATE_INTERVAL_IN_MINUTE', '24 * 60L'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.majorVersion
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'commons-net:commons-net:3.11.1'

    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'javax.inject:javax.inject:1'
    implementation 'com.google.code.gson:gson:2.8.2'
    implementation 'io.appwrite:sdk-for-android:6.1.0'
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-config-ktx'
}
